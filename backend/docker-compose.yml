services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sanket
      POSTGRES_PASSWORD: sanket
      POSTGRES_DB: sanket
    ports:
      - "5432:5432"
    volumes:
      - sanket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanket"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sanket:sanket@db:5432/sanket
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  sanket_pgdata:
